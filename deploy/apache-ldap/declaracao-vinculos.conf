# Login com a conta de rede (Active Directory/LDAP) via Apache httpd.
# Requer: mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_authnz_ldap.
# Ajuste os valores <...> com a equipe de TI.
<VirtualHost *:443>
    ServerName <formulario.orgao.gov.br>
    SSLEngine on
    SSLCertificateFile    <caminho/certificado.pem>
    SSLCertificateKeyFile <caminho/chave.pem>

    # Remove cabeçalhos de identidade vindos do cliente (impede falsificação)
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-Remote-Email early
    RequestHeader unset X-Remote-Name early

    <Location />
        AuthType Basic
        AuthName "Login institucional"
        AuthBasicProvider ldap
        AuthLDAPURL "<ldaps://ad.orgao.gov.br/OU=Usuarios,DC=orgao,DC=gov,DC=br?sAMAccountName,mail,displayName?sub?(objectClass=user)>"
        AuthLDAPBindDN "<CN=svc-formulario,OU=Servicos,DC=orgao,DC=gov,DC=br>"
        AuthLDAPBindPassword "<senha-da-conta-de-servico>"
        Require valid-user
        RequestHeader set X-Remote-User  "%{AUTHENTICATE_SAMACCOUNTNAME}e"
        RequestHeader set X-Remote-Email "%{AUTHENTICATE_MAIL}e"
        RequestHeader set X-Remote-Name  "%{AUTHENTICATE_DISPLAYNAME}e"
    </Location>

    # Rotas de integração e verificação: sem login de rede (usam token Bearer ou são públicas)
    <LocationMatch "^/(saude$|api/v1/(integracao/|verificar/|schema$))">
        Require all granted
    </LocationMatch>

    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
