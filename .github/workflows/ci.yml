name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Exemplo válido contra o esquema
        run: python -c "import json,jsonschema;s=json.load(open('schema/declaracao_vinculos.schema.json'));jsonschema.Draft202012Validator.check_schema(s);jsonschema.validate(json.load(open('examples/exemplo_declaracao.json')),s);print('ok')"
      - name: Testes
        run: pytest -q

  imagem:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t declaracao-vinculos:ci .
